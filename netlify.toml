[build]
  publish = "website"

# Admin console: rewrite only entry routes — never /assets/* (breaks JS/CSS on admin host)
[[redirects]]
  from = "/"
  to = "/pages/dashboard.html"
  status = 200
  force = true
  [redirects.conditions]
  Host = ["admin.cravex.co.in"]

[[redirects]]
  from = "/dashboard"
  to = "/pages/dashboard.html"
  status = 200
  force = true
  [redirects.conditions]
  Host = ["admin.cravex.co.in"]

[[redirects]]
  from = "/app"
  to = "/pages/dashboard.html"
  status = 200
  force = true
  [redirects.conditions]
  Host = ["admin.cravex.co.in"]

[[headers]]
  for = "https://admin.cravex.co.in/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
